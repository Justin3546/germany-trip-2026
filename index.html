<html lang="en">

<style>
/* Layout: a full-bleed topographic map fixed behind the page; the story scrolls over its left third,
   and the map's camera and the travel line are driven by how far you have read. */
:root {
  --paper: #e4e7e1;      /* sea and page ground */
  --land: #f3f2ec;
  --water: #b7cfd9;
  --ink: #1d2a31;
  --ink-2: #56636a;
  --ink-3: #8a959a;
  --card: rgba(250, 250, 246, 0.94);
  --rule: #d3d7cf;
  --border-line: #9aa49f;
  --river: #8fb3c2;
  --contour: #b0946f;
  --casing: #ffffff;
  --d-flight: #e8344f;
  --d-park: #e57a12;
  --d-alps: #2f8550;
  --d-summit: #2a78c4;
  --d-zurich: #8a5ab3;
  --font-display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-data: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --col: min(480px, 40vw);
  --shadow: 0 1px 0 rgba(29,42,49,.06), 0 10px 30px -12px rgba(29,42,49,.28);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1418; --land: #182227; --water: #0f2a37; --ink: #e5ece9; --ink-2: #a7b3b2; --ink-3: #72807f;
  --card: rgba(20, 29, 33, 0.93); --rule: #2a373c; --border-line: #4c5b5f; --river: #24506a; --contour: #6e5c47; --casing: #0d1418;
  --d-flight: #ff5a70; --d-park: #f39a3c; --d-alps: #4fb377; --d-summit: #5aa3ea; --d-zurich: #b388dd;
  --shadow: 0 10px 30px -10px rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0d1418; --land: #182227; --water: #0f2a37; --ink: #e5ece9; --ink-2: #a7b3b2; --ink-3: #72807f;
  --card: rgba(20, 29, 33, 0.93); --rule: #2a373c; --border-line: #4c5b5f; --river: #24506a; --contour: #6e5c47; --casing: #0d1418;
  --d-flight: #ff5a70; --d-park: #f39a3c; --d-alps: #4fb377; --d-summit: #5aa3ea; --d-zurich: #b388dd;
  --shadow: 0 10px 30px -10px rgba(0,0,0,.6); color-scheme: dark }

* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }

/* MAP */
#map { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
#map canvas, #map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#map svg.route { pointer-events: none; overflow: visible; }
.lbl { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; font-stretch: 85%; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3.5px; stroke-linejoin: round; letter-spacing: .01em; }
.lbl.city { font-size: 14px; font-weight: 700; }
.lbl.country { font-size: 13px; font-weight: 500; font-stretch: 125%; letter-spacing: .32em; fill: var(--ink-3); stroke: none; text-transform: uppercase; }
.lbl.water { font-family: var(--font-body); font-style: italic; font-weight: 400; fill: #4b7e93; stroke: none; font-size: 13px; }
.lbl.peak { font-size: 11.5px; font-weight: 600; fill: var(--ink-2); }
.lbl .elev { font-family: var(--font-data); font-weight: 400; font-size: 10px; fill: var(--ink-3); }
.dot { fill: var(--land); stroke: var(--ink); stroke-width: 1.6; }
.dot.done { fill: var(--ink); }
.peakmark { fill: var(--ink-2); }
.tip-ring { fill: none; stroke-width: 2; animation: ping 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(2.4); } }

/* map chrome */
.hud { position: fixed; z-index: 3; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 10px 14px 11px; min-width: 248px; box-shadow: var(--shadow); font-family: var(--font-data); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); }
.hud .when { font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.hud .when i { width: 10px; height: 10px; border-radius: 50%; background: var(--hud-c, var(--ink)); display: inline-block; transition: background .3s; }
.hud .what { color: var(--ink); margin-top: 3px; font-size: 12.5px; min-height: 1.4em; }
.hud .alt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 8px; }
.hud .bar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.hud .bar b { display: block; height: 100%; width: 0; background: var(--hud-c, var(--ink)); border-radius: 2px; }
.hud .coord { margin-top: 4px; color: var(--ink-3); font-size: 11px; }
.legend { position: fixed; z-index: 3; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: 420px; font-family: var(--font-data); font-size: 11px; color: var(--ink-2); box-shadow: var(--shadow); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend svg { width: 30px; height: 8px; overflow: visible; }
.scale { position: fixed; z-index: 3; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: calc(var(--col) + 56px); font-family: var(--font-data); font-size: 11px; color: var(--ink-2); }
.scale div { height: 6px; border: 1.5px solid var(--ink-2); border-top: 0; margin-bottom: 3px; }
.postcard { position: fixed; z-index: 2; width: 200px; background: #fffdf8; padding: 8px 8px 10px; box-shadow: 0 14px 34px -14px rgba(0,0,0,.55); transform: rotate(var(--rot, 2deg)) translateY(12px); opacity: 0; transition: opacity .45s ease, transform .6s cubic-bezier(.2,.8,.2,1); cursor: zoom-in; border: 0; text-align: left; font: inherit; }
.postcard.on { opacity: 1; transform: rotate(var(--rot, 2deg)) translateY(0); }
.postcard img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.postcard span { display: block; font-family: var(--font-display); font-stretch: 90%; font-weight: 600; font-size: 12px; color: #2b2b2b; margin-top: 7px; letter-spacing: .02em; }

/* STORY */
main { position: relative; z-index: 1; width: calc(var(--col) + 32px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; padding-block: 24px 30vh; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); backdrop-filter: blur(8px); padding: 26px 28px 28px; }
.intro { min-height: calc(100vh - 48px); display: flex; flex-direction: column; justify-content: center; }
.intro .card { padding: 34px 30px 30px; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-family: var(--font-display); font-stretch: 112%; font-weight: 900; font-size: clamp(30px, 3vw, 44px); line-height: .95; letter-spacing: -.01em; margin: 10px 0 14px; text-transform: uppercase; text-wrap: balance; }
h1 em { font-style: normal; display: block; font-stretch: 62%; font-weight: 800; color: var(--d-summit); font-size: .62em; letter-spacing: .02em; margin-top: 6px; }
.lede { margin: 0 0 18px; color: var(--ink-2); font-size: 18px; max-width: 34ch; }
.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.stops li { display: grid; grid-template-columns: 54px 14px 1fr; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-family: var(--font-display); font-stretch: 92%; font-weight: 600; font-size: 14.5px; }
.stops li small { font-family: var(--font-data); font-weight: 400; font-size: 11.5px; color: var(--ink-3); }
.stops li i { width: 10px; height: 10px; border-radius: 50%; }
.cue { margin-top: 18px; font-family: var(--font-data); font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.cue svg { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }

.day { padding-top: 46vh; }
.day:first-of-type { padding-top: 20vh; }
.day-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.badge { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 13px; letter-spacing: .1em; color: #fff; background: var(--c); padding: 3px 8px 2px; border-radius: 2px; }
.date { font-family: var(--font-data); font-size: 12.5px; color: var(--ink-2); letter-spacing: .02em; }
h2 { font-family: var(--font-display); font-stretch: 105%; font-weight: 800; font-size: 30px; line-height: 1.02; margin: 12px 0 16px; letter-spacing: -.005em; text-wrap: balance; }
.tl { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 0; }
.tl li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--rule); font-size: 15px; line-height: 1.35; }
.tl li:last-child { border-bottom: 1px dashed var(--rule); }
.tl time { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-3); padding-top: 2px; }
.tl strong { font-family: var(--font-display); font-stretch: 95%; font-weight: 700; font-size: 15px; }
.tl .where { color: var(--ink-2); }
.tl li.hi strong { color: var(--c); }
.entry { margin: 0 0 14px; max-width: 62ch; }
.vid { position: relative; margin: 6px 0 14px; }
video { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; display: block; background: #000; border-radius: 3px; }
.play { position: absolute; inset: 0; width: 100%; border: 0; padding: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.45)); border-radius: 3px; cursor: pointer; color: #fff; display: grid; place-items: center; font: inherit; }
.play svg { width: 64px; height: 64px; padding: 16px 14px 16px 18px; border-radius: 50%; background: var(--c, var(--ink)); fill: #fff; box-shadow: 0 8px 24px -6px rgba(0,0,0,.6); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.play:hover svg { transform: scale(1.08); }
.play span { position: absolute; left: 12px; bottom: 9px; font-family: var(--font-display); font-stretch: 105%; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.play:focus-visible { outline: 3px solid var(--d-summit); outline-offset: 2px; }
.vid.on .play { display: none; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grid button { padding: 0; border: 0; background: var(--rule); aspect-ratio: 1; overflow: hidden; border-radius: 2px; cursor: zoom-in; display: block; }
.grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s; }
.grid button:hover img { transform: scale(1.05); }
.grid button:focus-visible, .postcard:focus-visible { outline: 3px solid var(--d-summit); outline-offset: 2px; }
.js .grid.pre button img { opacity: 0; transform: translateY(18px) scale(.96); }
.grid.go button img { transition-delay: calc(var(--i) * 45ms); }
.count { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-3); margin: 0 0 8px; }

.finale .card { padding-bottom: 24px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 4px 0 18px; border-top: 1px solid var(--rule); }
.stats div { padding: 12px 0 10px; border-bottom: 1px solid var(--rule); }
.stats div:nth-child(odd) { padding-right: 12px; border-right: 1px solid var(--rule); }
.stats div:nth-child(even) { padding-left: 14px; }
.stats b { display: block; font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stats small { font-family: var(--font-data); font-size: 11px; color: var(--ink-2); }
.note { font-size: 13px; color: var(--ink-3); margin: 0; }

/* LIGHTBOX */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 14, .93); display: grid; place-items: center; padding: 48px max(16px, env(safe-area-inset-left, 0px)); }
.lb[hidden] { display: none; }
.lb img { max-width: 100%; max-height: calc(100vh - 110px); object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lb p { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; margin: 0; font-family: var(--font-data); font-size: 12px; color: #c9d1d3; }
.lb button { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.1); color: #fff; border: 0; width: 46px; height: 46px; border-radius: 50%; font-size: 22px; cursor: pointer; }
.lb button:hover { background: rgba(255,255,255,.2); }
.lb .prev { left: max(14px, env(safe-area-inset-left, 0px)); } .lb .next { right: max(14px, env(safe-area-inset-right, 0px)); }
.lb .close { top: calc(28px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); transform: none; font-size: 18px; }

/* PHONE: map pinned to the top, story below it */
@media (max-width: 760px) {
  :root { --col: 100vw; }
  #map { bottom: auto; height: 46vh; border-bottom: 1px solid var(--rule); z-index: 2; } /* the story slides under the map, not over it */
  main { width: 100%; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(46vh + 16px); }
  .intro { min-height: 0; }
  .day, .day:first-of-type { padding-top: 34vh; }
  .card { padding: 20px 18px 22px; backdrop-filter: none; background: var(--land); }
  .hud { top: calc(8px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); min-width: 0; width: 196px; padding: 7px 10px; font-size: 11px; }
  .hud .when { font-size: 12.5px; } .hud .coord { display: none; }
  .legend, .postcard { display: none; }
  .scale { left: max(12px, env(safe-area-inset-left, 0px)); bottom: auto; top: calc(46vh - 30px); }
  .tl li { grid-template-columns: 74px 1fr; }
  h2 { font-size: 25px; }
  .stats b { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .tip-ring, .cue svg { animation: none; }
  .js .grid.pre button img { opacity: 1; transform: none; }
  .postcard { transition: opacity .2s; }
}
</style>
</head>

</div>

</div>

<script>
document.documentElement.classList.add('js');
if (!location.hash) { history.scrollRestoration = 'manual'; scrollTo(0, 0); } // always open at the top

/* ---------- projection: web mercator, world = 256000 units ---------- */
const P = (lon, lat) => [ (lon + 180) / 360 * 256000,
  (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * 256000 ];
const metersPerUnit = (lat) => 40075016 / 256000 * Math.cos(lat * Math.PI / 180);

/* ---------- places ---------- */
const PL = {
  IAH: [-95.3414, 29.9902, 30], FRA: [8.5622, 50.0379, 111], RUST: [7.7215, 48.266, 165],
  GRI: [8.0337, 46.6243, 1034], PFV: [8.0436, 46.6205, 1050], PFI: [8.0570, 46.6118, 1391],
  TER: [8.0196, 46.6185, 943], EIG: [7.9746, 46.5752, 2320], EIS: [7.9966, 46.5634, 3160], JOCH: [7.9845, 46.5474, 3454],
  FIV: [8.0381, 46.6253, 1050], BORT: [8.0599, 46.6370, 1570], SCH: [8.0641, 46.6497, 1955], FIRST: [8.0545, 46.6595, 2168], HIKE: [8.0405, 46.6648, 2240],
  INT: [7.8691, 46.6905, 568], SPZ: [7.6807, 46.6863, 628], THUN: [7.6299, 46.7548, 560], BERN: [7.4391, 46.949, 540],
  ZHB: [8.5403, 47.3779, 408], LINDT: [8.5487, 47.3225, 430], ZRH: [8.5555, 47.4582, 432],
};
const elev = (p) => p[2];

/* label specs: [text, lon, lat, class, minSpanKm, maxSpanKm, anchor, sub] */
const LABELS = [
  ['United States', -98, 37, 'country', 2500, 1e9, 'm'], ['Atlantic Ocean', -42, 38, 'water', 2500, 1e9, 'm'],
  ['Germany', 10.0, 50.6, 'country', 160, 2400, 'm'], ['France', 6.0, 48.3, 'country', 160, 2400, 'm'],
  ['Switzerland', 8.3, 46.95, 'country', 150, 1400, 'm'], ['Italy', 9.4, 45.75, 'country', 200, 1400, 'm'], ['Austria', 10.9, 47.35, 'country', 220, 1400, 'm'],
  ['Houston', ...PL.IAH.slice(0, 2), 'city', 1500, 1e9, 'r'], ['Frankfurt', ...PL.FRA.slice(0, 2), 'city', 80, 1e9, 'r'],
  ['Europa-Park', ...PL.RUST.slice(0, 2), 'city', 15, 900, 'l'], ['Basel', 7.588, 47.56, 'plain', 100, 700, 'l'], ['Bern', ...PL.BERN.slice(0, 2), 'plain', 60, 700, 'l'],
  ['Zürich', ...PL.ZHB.slice(0, 2), 'city', 5, 900, 'r'], ['Interlaken', ...PL.INT.slice(0, 2), 'plain', 20, 260, 'l'], ['Grindelwald', ...PL.GRI.slice(0, 2), 'city', 5, 500, 'r'],
  ['Pfingstegg', ...PL.PFI.slice(0, 2), 'plain', 4, 22, 'r'], ['Eigergletscher', ...PL.EIG.slice(0, 2), 'plain', 4, 22, 'l'], ['Eismeer', ...PL.EIS.slice(0, 2), 'plain', 4, 18, 'r'],
  ['Jungfraujoch', ...PL.JOCH.slice(0, 2), 'city', 4, 30, 'b', '3,454 m'], ['First', ...PL.FIRST.slice(0, 2), 'plain', 4, 22, 'l', '2,168 m'], ['Schreckfeld', ...PL.SCH.slice(0, 2), 'plain', 4, 14, 'r'],
  ['Bachalpsee', 8.0234, 46.6695, 'water', 4, 14, 'l'], ['Kilchberg · Lindt', ...PL.LINDT.slice(0, 2), 'plain', 5, 40, 'r'], ['Zürich Airport', ...PL.ZRH.slice(0, 2), 'plain', 8, 60, 'r'],
  ['Thunersee', 7.72, 46.71, 'water', 25, 160, 'm'], ['Brienzersee', 7.98, 46.735, 'water', 20, 120, 'm'], ['Zürichsee', 8.66, 47.27, 'water', 14, 140, 'm'],
  ['Rhine', 7.53, 48.0, 'water', 60, 400, 'm'],
  ['Eiger', 8.0053, 46.5776, 'peak', 4, 40, 'r', '3,967'], ['Mönch', 7.9974, 46.5585, 'peak', 4, 30, 'r', '4,107'], ['Jungfrau', 7.9626, 46.5367, 'peak', 4, 40, 'l', '4,158'],
];

/* ---------- legs: the line, day by day ---------- */
const route = (...ks) => ks.map((k) => (typeof k === 'string' ? PL[k] : k));
function arc(a, b, n = 72) { // great circle, longitude-interpolated in degrees
  const r = Math.PI / 180, [l1, p1] = [a[0] * r, a[1] * r], [l2, p2] = [b[0] * r, b[1] * r];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
  const out = [];

  const ca = 1 - ramp(c.span, 14, 34);
  if (ca > 0.01) {
    ctx.strokeStyle = colors.contour;
    for (const k of CONTOURS) { const idx = k.e % 500 === 0; ctx.globalAlpha = ca * (idx ? 0.85 : 0.45); ctx.lineWidth = (idx ? 1.1 : 0.6) * px; ctx.stroke(k.p); }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = colors.water; ctx.fill(PATHS.lakes);
  if (c.span < 900) { ctx.strokeStyle = colors.river; ctx.lineWidth = 1.3 * px; ctx.globalAlpha = Math.min(1, (900 - c.span) / 400); ctx.stroke(PATHS.rivers); ctx.globalAlpha = 1; }
  ctx.strokeStyle = colors.border; ctx.setLineDash([5 * px, 3 * px]); ctx.lineWidth = 1.1 * px;
  const near = c.span < 1600 ? 1 : 0;
  ctx.stroke(near ? PATHS.b10 : PATHS.b50); ctx.setLineDash([]);
}

function partial(L, f, T) { // screen-space points of the first f of a leg
  const target = L.len * f, out = [];
  for (let i = 0; i < L.xy.length; i++) {
    if (L.cum[i] <= target) { out.push(L.xy[i]); continue; }
    const a = L.xy[i - 1], b = L.xy[i], u = (target - L.cum[i - 1]) / (L.cum[i] - L.cum[i - 1]);
    out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); break;
  }
  return out.map(([x, y]) => [x * T.k + T.ox, y * T.k + T.oy]);
}
/* Clip a screen-space polyline to the viewport (plus a margin) before it becomes SVG. Zoomed in on the
   Alps, a transatlantic arc is millions of pixels long, and Chrome rasterises every dash of it each frame;
   that, not the map, was the jerk. The dash offset keeps the visible dashes where they would have been. */
const CLIP = 60;
function clipSeg(a, b) { // Liang-Barsky against the padded viewport; returns [t0, t1] or null
  let t0 = 0, t1 = 1; const dx = b[0] - a[0], dy = b[1] - a[1];
  const q = [[-dx, a[0] + CLIP], [dx, W + CLIP - a[0]], [-dy, a[1] + CLIP], [dy, H + CLIP - a[1]]];
  for (const [p, r] of q) {
    if (p === 0) { if (r < 0) return null; continue; }
    const t = r / p;
    if (p < 0) { if (t > t1) return null; if (t > t0) t0 = t; } else { if (t < t0) return null; if (t < t1) t1 = t; }
  }
  return [t0, t1];
}
function dstr(pts) {
  if (pts.length < 2) return { d: '', off: 0 };
  let d = '', run = false, off = -1, walked = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]), c = clipSeg(a, b);
    if (c) {
      const at = (t) => (a[0] + (b[0] - a[0]) * t).toFixed(1) + ' ' + (a[1] + (b[1] - a[1]) * t).toFixed(1);
      if (!run || c[0] > 0) { d += 'M' + at(c[0]); if (off < 0) off = walked + len * c[0]; }
      d += 'L' + at(c[1]); run = c[1] === 1;
    } else run = false;
    walked += len;
  }
  return { d, off: off < 0 ? 0 : off };
}

/* The overlay is built once and only its attributes change per frame; rebuilding it as an
   HTML string every frame cost a parse, a style pass and a layout on each scroll tick. */
let tipInfo = null;
const sv = (tag, attrs, parent = ov) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const put = (e, k, v) => { if (e['_' + k] !== v) { e['_' + k] = v; e.setAttribute(k, v); } };
const OV = (() => {
  // the ghost of the whole trip, so you can see where the line is headed
  const ghosts = LEGS.map(() => sv('path', { fill: 'none', stroke: 'var(--ink-3)', 'stroke-opacity': '.35', 'stroke-width': '1.2', 'stroke-dasharray': '2 4' }));
  const legs = LEGS.map((L) => {
    const col = DAYS[L.day - 1].c, g = sv('g', { display: 'none' });
    const strokes = STYLE[L.mode].map((st) => sv('path', { fill: 'none', stroke: st.casing ? 'var(--casing)' : st.white ? 'var(--land)' : col, 'stroke-width': st.w,
      ...(st.dash ? { 'stroke-dasharray': st.dash } : {}), 'stroke-linecap': st.cap || 'round', 'stroke-linejoin': 'round' }, g));
    const stations = L.mode === 'lift' || L.mode === 'zip' ? sv('path', { fill: 'var(--land)', stroke: col, 'stroke-width': '1.6' }, g) : null;
    return { g, strokes, stations };
  });
  const labels = LABELS.map(([t, lon, lat, cls, mn, mx, anc, sub]) => {
    const g = sv('g', { display: 'none' });
    let dx = 0, dy = 4, ta = 'middle';
    if (anc === 'r') { dx = 9; ta = 'start'; } else if (anc === 'l') { dx = -9; ta = 'end'; } else if (anc === 'b') { dy = 20; }
    let dot = null;
    if (cls === 'peak') sv('path', { class: 'peakmark', d: 'M-5 4L0 -5L5 4Z' }, g);
    else if (cls !== 'country' && cls !== 'water') dot = sv('circle', { class: 'dot', r: cls === 'city' ? 4.2 : 3.2 }, g);
    const tx = sv('text', { class: 'lbl ' + cls, x: dx, y: dy, 'text-anchor': ta }, g); tx.textContent = t;
    if (sub) { tx.append(' '); sv('tspan', { class: 'elev' }, tx).textContent = sub; }
    return { g, dot, xy: P(lon, lat), t, lon, lat, mn, mx };
  });
  const ring = sv('circle', { r: 9, class: 'tip-ring', display: 'none' }), tip = sv('circle', { r: 5, stroke: 'var(--casing)', 'stroke-width': 2, display: 'none' });
  return { ghosts, legs, labels, ring, tip };
})();
function drawOverlay(c, s, T) {
  LEGS.forEach((L, j) => { const g = dstr(partial(L, 1, T)); put(OV.ghosts[j], 'd', g.d || 'M0 0'); put(OV.ghosts[j], 'stroke-dashoffset', g.off.toFixed(1)); });
  tipInfo = null;
  LEGS.forEach((L, j) => {
    const E = OV.legs[j], f = Math.max(0, Math.min(1, (s - L.s0) / (L.s1 - L.s0)));
    put(E.g, 'display', f > 0 ? 'inline' : 'none');
    if (f <= 0) return;
    const pts = partial(L, f, T), { d, off } = dstr(pts), col = DAYS[L.day - 1].c;
    for (const p of E.strokes) { put(p, 'd', d || 'M0 0'); put(p, 'stroke-dashoffset', off.toFixed(1)); }
    if (E.stations) { // station squares
      let sd = '';
      for (let i = 0; i < L.xy.length; i++) if (L.cum[i] <= L.len * f) { const x = L.xy[i][0] * T.k + T.ox, y = L.xy[i][1] * T.k + T.oy;
        if (x > -20 && x < W + 20 && y > -20 && y < H + 20) sd += `M${(x - 3).toFixed(1)} ${(y - 3).toFixed(1)}h6v6h-6z`; }
      put(E.stations, 'd', sd || 'M0 0');
    }
    const tip = pts[pts.length - 1];
    // elevation and position at the tip
    const target = L.len * f; let i = 1; while (i < L.cum.length - 1 && L.cum[i] < target) i++;
    const u = L.cum[i] === L.cum[i - 1] ? 1 : Math.min(1, (target - L.cum[i - 1]) / (L.cum[i] - L.cum[i - 1]));
    const lerp = (k) => L.pts[i - 1][k] + (L.pts[i][k] - L.pts[i - 1][k]) * u;
    tipInfo = { L, f, tip, col, elev: lerp(2), lon: lerp(0), lat: lerp(1) };
  });
  // labels and places
  for (const Lb of OV.labels) {
    const x = Lb.xy[0] * T.k + T.ox, y = Lb.xy[1] * T.k + T.oy;
    const show = c.span >= Lb.mn && c.span <= Lb.mx && x >= -100 && x <= W + 100 && y >= -40 && y <= H + 40;
    put(Lb.g, 'display', show ? 'inline' : 'none');
    if (!show) continue;
    put(Lb.g, 'transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    put(Lb.g, 'opacity', Math.min(1, Math.log(c.span / Lb.mn) * 4, Math.log(Lb.mx / c.span) * 4).toFixed(2));
    if (Lb.dot) {
      const done = LEGS.some((L) => (s - L.s0) / (L.s1 - L.s0) >= 1 && Math.abs(L.pts[L.pts.length - 1][0] - Lb.lon) < 1e-4 && Math.abs(L.pts[L.pts.length - 1][1] - Lb.lat) < 1e-4) || (Lb.t === 'Houston');
      put(Lb.dot, 'class', done ? 'dot done' : 'dot');
    }
  }
  const on = tipInfo && tipInfo.f < 1 ? 'inline' : 'none';
  put(OV.ring, 'display', on); put(OV.tip, 'display', on);
  if (on === 'inline') {
    const [x, y] = tipInfo.tip.map((v) => v.toFixed(1));
    for (const e of [OV.ring, OV.tip]) { put(e, 'cx', x); put(e, 'cy', y); }
    put(OV.ring, 'stroke', tipInfo.col); put(OV.tip, 'fill', tipInfo.col);
  }
}

/* HUD, scale bar and postcard */
const hud = document.getElementById('hud'), hWhen = document.getElementById('h-when'), hWhat = document.getElementById('h-what'),
  hElev = document.getElementById('h-elev'), hBar = document.getElementById('h-bar'), hCoord = document.getElementById('h-coord');
const scaleEl = document.getElementById('scale'), pc = document.getElementById('pc');
let pcDay = 0;
// writes only what changed, so an unchanged HUD costs no style or layout work
const txt = (el, prop, v) => { const k = '_' + prop; if (el[k] === v) return; el[k] = v;
  if (!prop) el.textContent = v; else if (prop.startsWith('--')) el.style.setProperty(prop, v); else el.style[prop] = v; };
function chrome(c, s, T) {
  const cur = [...SEC].reverse().find((S) => s >= S.top) || SEC[0];
  if (cur.n >= 1 && cur.n <= 8) {
    const D = DAYS[cur.n - 1]; txt(hud, '--hud-c', D.c); txt(hWhen, 0, `Day ${cur.n} · ${D.when.split(' · ')[1]}`);
  } else if (cur.n === 9) { txt(hud, '--hud-c', 'var(--ink)'); txt(hWhen, 0, 'Home · Oct 17'); }
  else { txt(hud, '--hud-c', 'var(--ink)'); txt(hWhen, 0, 'Oct 9 – 17, 2026'); }
  if (tipInfo && cur.n >= 1 && cur.n <= 8) {
    const t = tipInfo; txt(hWhat, 0, t.f < 1 ? t.L.label : t.L.label.split(' · ')[0] + ' · arrived');
    txt(hElev, 0, Math.round(t.elev).toLocaleString('en-US') + ' m');
    txt(hBar, 'width', Math.min(100, t.elev / 110).toFixed(1) + '%');
    txt(hCoord, 0, `${Math.abs(t.lat).toFixed(4)}° N  ${Math.abs(t.lon).toFixed(4)}° ${t.lon < 0 ? 'W' : 'E'}`);
  } else if (cur.n === 9) { txt(hWhat, 0, `≈ ${TOTAL_KM.toLocaleString('en-US')} km door to door`); txt(hElev, 0, 'max 3,454 m'); txt(hBar, 'width', '32%'); txt(hCoord, 0, '29.9902° N  95.3414° W'); }
  else { txt(hWhat, 0, 'Houston · Frankfurt · Alps · Zürich'); txt(hElev, 0, '–'); txt(hBar, 'width', '0'); txt(hCoord, 0, '\u00a0'); }
  // scale bar
  const mpp = metersPerUnit(c.lat) / T.k, maxM = 110 * mpp;
  const nice = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000].filter((m) => m <= maxM).pop() || 10;
  txt(scaleEl.firstChild, 'width', (nice / mpp).toFixed(0) + 'px');
  txt(scaleEl.lastChild, 0, nice >= 1000 ? (nice / 1000).toLocaleString('en-US') + ' km' : nice + ' m');
  // postcard for the day being read
  const day = cur.n >= 1 && cur.n <= 8 && (s - cur.top) / cur.h > 0.08 && (s - cur.top) / cur.h < 0.97 ? cur.n : 0;
  if (day !== pcDay) {
    pcDay = day; pc.classList.remove('on');
    if (day) {
      const st = STORY[day - 1]; pc.querySelector('img').src = `media/d${day}/img${st.pc}.jpg`;
      pc.querySelector('span').textContent = `Day ${day} · ${st.title}`; pc.style.setProperty('--rot', (day % 2 ? 2.2 : -2) + 'deg');
      pc.dataset.k = PHOTOS.findIndex((p) => p.day === day && p.i === st.pc);
      requestAnimationFrame(() => pc.classList.add('on'));
    }
  }
}
function placePostcard() { // lower-left of the map's open area, clear of the story column and the legend
  const colRight = main.getBoundingClientRect().right;
  pc.style.left = colRight + 40 + 'px'; pc.style.bottom = 70 + 'px';
}

/* frame loop: the drawn state eases toward the scroll position */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let sNow = -1, dirty = true;
function frame() {
  const target = scrollY + readLine;
  if (sNow < 0 || reduce) sNow = target; else sNow += (target - sNow) * 0.16;
  if (Math.abs(target - sNow) < 0.5) sNow = target;
  if (dirty || Math.abs(target - sNow) > 0.01) {
    const c = camera(sNow), T = cam2screen(c);
    drawMap(c, T); drawOverlay(c, sNow, T); chrome(c, sNow, T);
    dirty = target !== sNow;
  }
  requestAnimationFrame(frame);
}
addEventListener('scroll', () => (dirty = true), { passive: true });
addEventListener('resize', () => { resize(); placePostcard(); });
new ResizeObserver(() => { layout(); dirty = true; }).observe(main);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
readColors(); resize(); placePostcard(); requestAnimationFrame(frame);

/* photos rise in as each grid arrives; anything already on screen stays put */
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('go'); e.target.classList.remove('pre'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
document.querySelectorAll('.grid').forEach((g) => { if (g.getBoundingClientRect().top > innerHeight) { g.classList.add('pre'); io.observe(g); } });
/* videos never start on their own: the poster and a play button until the viewer asks, then normal controls.
   One plays at a time, and one scrolled out of view pauses. */
const vio = new IntersectionObserver((es) => es.forEach((e) => { if (!e.isIntersecting) e.target.pause(); }), { threshold: 0 });
document.querySelectorAll('.vid video').forEach((v) => vio.observe(v));

/* lightbox */
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbCap = lb.querySelector('p');
let lbK = 0;
function openLb(k) { lbK = (k + PHOTOS.length) % PHOTOS.length; const p = PHOTOS[lbK]; lbImg.src = p.src; lbCap.textContent = `Day ${p.day} · ${STORY[p.day - 1].title} · ${p.i} of ${p.of}`; lb.hidden = false; }
document.addEventListener('click', (e) => {
  const pl = e.target.closest('.vid .play');
  if (pl) { const v = pl.parentNode.querySelector('video'); document.querySelectorAll('.vid video').forEach((o) => o !== v && o.pause());
    pl.parentNode.classList.add('on'); v.controls = true; v.play().catch(() => {}); return; }
  const b = e.target.closest('.grid button, .postcard'); if (b) return openLb(+b.dataset.k);
  if (e.target.closest('.lb .prev')) return openLb(lbK - 1);
  if (e.target.closest('.lb .next')) return openLb(lbK + 1);
  if (e.target === lb || e.target.closest('.lb .close')) lb.hidden = true;
});
document.addEventListener('keydown', (e) => {
  if (lb.hidden) return;
  if (e.key === 'Escape') lb.hidden = true; else if (e.key === 'ArrowLeft') openLb(lbK - 1); else if (e.key === 'ArrowRight') openLb(lbK + 1);
});
</script>
